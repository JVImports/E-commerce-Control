[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/theme.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/theme-toggle.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/layout-fixes.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ads-analyzer.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ads-analyzer.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ads-analyzer-product-ads.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ads-analyzer-product-ads.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hotfix.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200